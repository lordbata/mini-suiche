# Azure Key Vault -> Kubernetes.
# El CSI Secrets Store Driver (add-on de AKS) lee los secretos de Key Vault usando
# una identidad administrada (sin contraseñas en el clúster) y los sincroniza como
# Secret de Kubernetes, que los pods leen como variables de entorno.
# Los valores __ASÍ__ los reemplaza azure/deploy-aks.sh.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: card-vault-kv
  namespace: mini-suiche
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__KV_IDENTITY_CLIENT_ID__"
    keyvaultName: "__KEYVAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: vault-encryption-key
          objectType: secret
        - |
          objectName: vault-hmac-key
          objectType: secret
        - |
          objectName: vault-db-password
          objectType: secret
  secretObjects:
    - secretName: card-vault-secrets
      type: Opaque
      data:
        - objectName: vault-encryption-key
          key: VAULT_CRYPTO_ENCRYPTIONKEY
        - objectName: vault-hmac-key
          key: VAULT_CRYPTO_HMACKEY
        - objectName: vault-db-password
          key: DB_PASSWORD
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: payment-kv
  namespace: mini-suiche
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__KV_IDENTITY_CLIENT_ID__"
    keyvaultName: "__KEYVAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: payments-db-password
          objectType: secret
  secretObjects:
    - secretName: payment-secrets
      type: Opaque
      data:
        - objectName: payments-db-password
          key: DB_PASSWORD
