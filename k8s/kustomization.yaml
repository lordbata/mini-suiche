# Kustomize (incluido en kubectl): aplica todo junto con
#   kubectl apply -k k8s/
# y permite cambiar las imágenes por las del Azure Container Registry sin editar los YAML.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - card-vault.yaml
  - payment.yaml
  - network-policies.yaml
images:
  - name: card-vault-service
    newName: card-vault-service      # en Azure: <tu-acr>.azurecr.io/card-vault-service
    newTag: "1.0.0"
  - name: payment-service
    newName: payment-service
    newTag: "1.0.0"
