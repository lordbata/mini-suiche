# EJEMPLO para clúster local. Copiar como secrets.yaml (está en .gitignore) y aplicar:
#   kubectl apply -f k8s/secrets.yaml
#
# En Azure NO se usa este archivo: los secretos viven en Azure Key Vault y el
# CSI Secrets Store Driver los sincroniza (ver azure/secret-provider-class.yaml).
#
# Generar claves propias:  openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: card-vault-secrets
  namespace: mini-suiche
type: Opaque
stringData:
  VAULT_CRYPTO_ENCRYPTIONKEY: "CAMBIAR-openssl-rand-base64-32"
  VAULT_CRYPTO_HMACKEY: "CAMBIAR-openssl-rand-base64-32"
  DB_USER: VAULT
  DB_PASSWORD: vault_pwd
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: mini-suiche
type: Opaque
stringData:
  DB_USER: PAYMENTS
  DB_PASSWORD: payments_pwd
