# Deployment = "quiero N copias (pods) de este contenedor, siempre vivas".
# Service     = nombre DNS estable + balanceo entre esas copias.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-vault-service
  namespace: mini-suiche
  labels:
    app: card-vault-service
    pci-scope: cde            # Cardholder Data Environment: este pod SÍ toca el PAN
spec:
  replicas: 2                 # alta disponibilidad: si un pod muere, el otro atiende
  selector:
    matchLabels:
      app: card-vault-service
  strategy:
    type: RollingUpdate       # despliegue sin caída: reemplaza pods de a uno
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: card-vault-service
        pci-scope: cde
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: card-vault-service:1.0.0     # kustomization.yaml lo cambia por <tu-acr>.azurecr.io/...
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: mini-suiche-config
            - secretRef:
                name: card-vault-secrets
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { memory: 512Mi }
          # startup: da tiempo a que arranque Spring antes de evaluar las otras sondas
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 5
            failureThreshold: 30
          # liveness: si falla, Kubernetes REINICIA el pod
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
          # readiness: si falla, el Service deja de enviarle tráfico (pero no lo reinicia)
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp          # Tomcat necesita un /tmp escribible
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: card-vault-service
  namespace: mini-suiche
spec:
  type: ClusterIP              # solo accesible DENTRO del clúster
  selector:
    app: card-vault-service
  ports:
    - port: 8081
      targetPort: 8081
