apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: mini-suiche
  labels:
    app: payment-service
    pci-scope: connected       # conectado al CDE, pero sin acceso al PAN
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: payment-service
        pci-scope: connected
      annotations:
        # Prometheus descubre y recolecta las métricas automáticamente
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: payment-service:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: mini-suiche-config
            - secretRef:
                name: payment-secrets
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: mini-suiche
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 8082
      targetPort: 8082
---
# Escalado automático: de 2 a 6 pods según el uso de CPU (ej. picos de quincena)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  namespace: mini-suiche
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Durante mantenimientos del clúster, siempre debe quedar al menos 1 pod vivo
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service
  namespace: mini-suiche
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment-service
