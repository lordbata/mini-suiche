server:
  port: 8082
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:payments;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

card-vault:
  base-url: ${CARD_VAULT_URL:http://localhost:8081}
  connect-timeout: 2s
  read-timeout: 3s

payments:
  max-amount: 5000.00        # montos mayores se rechazan con LIMIT_EXCEEDED

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:PAYMENTS}
    password: ${DB_PASSWORD:payments_pwd}
    hikari:
      maximum-pool-size: 10
